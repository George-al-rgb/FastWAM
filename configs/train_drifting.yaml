# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null

output_dir: ./runs/drifting/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 8
num_workers: 4

lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
save_epochs: []
save_final_checkpoint: true
eval_every: 50
eval_num_inference_steps: 10

gradient_accumulation_steps: 1
mixed_precision: "bf16"
seed: 42
max_grad_norm: 1.0
weight_decay: 1e-2
resume: null

wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: drifting
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
