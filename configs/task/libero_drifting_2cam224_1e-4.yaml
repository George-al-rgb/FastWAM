# @package _global_

defaults:
  - override /data: libero_2cam_fastwam_v30
  - override /model: fastwam_drifting
  - _self_

data:
  train:
    pretrained_norm_stats: ./data/fastwam_release/dataset_stats.json

batch_size: 8
num_workers: 8

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
save_epochs: [5]
save_final_checkpoint: true
save_training_state: false
eval_every: 0

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
